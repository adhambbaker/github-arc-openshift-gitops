apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-gitops-rbacs
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: github-arc-project
  source:
    repoURL: https://github.com/adhambbaker/github-arc-openshift-gitops.git
    targetRevision: develop
    path: openshift
    directory:
      include: 
      - "argocd-rbac.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true