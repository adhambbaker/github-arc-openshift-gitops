# ---
# kind: SecurityContextConstraints
# apiVersion: security.openshift.io/v1
# metadata:
#   name: github-arc-scc
# allowPrivilegedContainer: false
# runAsUser:
#   type: MustRunAsRange 
#   uidRangeMin: 1000770001
#   uidRangeMax: 1000779999
# seLinuxContext:
#   type: RunAsAny
# fsGroup:
#   type: MustRunAs 
#   ranges:
#     - min: 1000770000
#       max: 1000779999
# supplementalGroups:
#   type: MustRunAs 
#   ranges:
#     - min: 1000770000
#       max: 1000779999

---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  annotations:
    kubernetes.io/description: Based on restricted SCC, but forces uid/gid 1001/123
  name: github-arc-scc
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
fsGroup:
  ranges:
  - max: 1000770001
    min: 1000770001
  type: MustRunAs
groups: []
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities:
- KILL
- MKNOD
- SETUID
- SETGID
runAsUser:
  type: MustRunAs
  uid: 1000770010
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  ranges:
  - max: 1000770001
    min: 1000770001
  type: MustRunAs
users: []
volumes:
- configMap
- csi
- downwardAPI
- emptyDir
- ephemeral
- persistentVolumeClaim
- projected
- secret