apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia-gpu
handler: nvidia
scheduling:
  nodeSelector:
    kubernetes.io/os: 'linux'
    ubernetes.io/arch: amd64
    nvidia.com/gpu.present: 'true'
    nvidia.com/gpu.mode: compute
  tolerations:
  - effect: NoSchedule
    key: 'nvidia.com/gpu'
    operator: Exists
  - effect: NoSchedule
    key: 'nvidia.com/gpu.present'
    operator: Equal
    value: 'true'