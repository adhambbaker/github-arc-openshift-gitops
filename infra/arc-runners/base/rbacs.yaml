apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-runner-role
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: arc-runners
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: github-arc
rules:
- apiGroups: [""]
  resources: ["pods", "pods/status", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# Allow runners to create/manage their own pods
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "delete", "patch", "update"]
  resourceNames: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-runner-rolebinding
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: arc-runners
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: github-arc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arc-runner-role
subjects:
- kind: ServiceAccount
  name: arc-runner
  namespace: arc-runners
---
# Additional ClusterRole for specific operations that require cluster-wide access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-runner-cluster-role
  labels:
    app.kubernetes.io/name: arc-runners
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: github-arc
rules:
# Allow reading nodes for resource allocation decisions
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Allow reading namespaces
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-runner-cluster-rolebinding
  labels:
    app.kubernetes.io/name: arc-runners
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: github-arc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arc-runner-cluster-role
subjects:
- kind: ServiceAccount
  name: arc-runner
  namespace: arc-runners
